<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Momentum</title>
    <link rel="icon" href="m.jpeg" type="image">
    <style>
        /* Your existing CSS remains the same */
        /* ... (all your CSS as in your code above) ... */
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Welcome</h1>
            <p>Sign in to your account or create a new one</p>
        </div>
        
        <div class="form-container">
            <div class="tabs">
                <div class="tab active" data-tab="login">Login</div>
                <div class="tab" data-tab="signup">Sign Up</div>
            </div>
            
            <form id="login-form" class="form active">
                <div class="form-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" placeholder="Enter your email" required>
                </div>
                
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" placeholder="Enter your password" required>
                </div>
                
                <div class="remember-forgot">
                    <div class="remember">
                        <input type="checkbox" id="remember">
                        <label for="remember">Remember me</label>
                    </div>
                    <a href="#" class="forgot">Forgot password?</a>
                </div>
                
                <button type="submit" class="btn btn-primary" id="login-btn">
                    <span class="btn-text">Login</span>
                </button>
                
                <div class="divider">
                    <span>Or</span>
                </div>
                
                <button type="button" class="btn btn-guest">Continue as Guest</button>
            </form>
            
            <form id="signup-form" class="form">
                <div class="form-group">
                    <label for="signup-name">Full Name</label>
                    <input type="text" id="signup-name" placeholder="Enter your full name" required>
                </div>
                
                <div class="form-group">
                    <label for="signup-email">Email</label>
                    <input type="email" id="signup-email" placeholder="Enter your email" required>
                </div>
                
                <div class="form-group">
                    <label for="signup-password">Password</label>
                    <input type="password" id="signup-password" placeholder="Create a password" required>
                </div>
                
                <div class="form-group">
                    <label for="signup-confirm">Confirm Password</label>
                    <input type="password" id="signup-confirm" placeholder="Confirm your password" required>
                </div>
                
                <div class="remember-forgot">
                    <div class="remember">
                        <input type="checkbox" id="agree-terms" required>
                        <label for="agree-terms">I agree to the <a href="#" class="terms-link">Terms of Service</a> and <a href="#" class="privacy-link">Privacy Policy</a></label>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary" id="signup-btn">
                    <span class="btn-text">Create Account</span>
                </button>
                
                <div class="divider">
                    <span>Or continue with</span>
                </div>
                
                <button type="button" class="btn btn-google">
                    <img src="data:image/svg+xml;base64,..." alt="Google">
                    Continue with Google
                </button>
                
                <button type="button" class="btn btn-guest">Continue as Guest</button>
            </form>
        </div>
        
        <div class="footer">
            By continuing, you agree to our <a href="#" class="terms-link">Terms of Service</a> and <a href="#" class="privacy-link">Privacy Policy</a>
        </div>
    </div>

    <!-- Modals omitted for brevity, same as above -->

    <script>
        const API_BASE_URL = 'http://localhost:8080/api/auth'; // Local backend

        // Tab switching
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.form').forEach(f => f.classList.remove('active'));
                tab.classList.add('active');
                const tabId = tab.getAttribute('data-tab');
                document.getElementById(`${tabId}-form`).classList.add('active');
            });
        });

        function setLoading(button, isLoading) {
            const btnText = button.querySelector('.btn-text');
            if (isLoading) {
                button.disabled = true;
                btnText.innerHTML = '<div class="spinner"></div>Processing...';
            } else {
                button.disabled = false;
                btnText.textContent = button.id === 'login-btn' ? 'Login' : 'Create Account';
            }
        }

        // LOGIN
        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const loginBtn = document.getElementById('login-btn');
            const username = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            setLoading(loginBtn, true);

            try {
                const response = await fetch(`${API_BASE_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();
                if (data.success) {
                    localStorage.setItem('authToken', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    alert('Login successful!');
                    window.location.href = 'home.html'; // local home
                } else {
                    alert('Login failed: ' + data.message);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('An error occurred during login. Make sure the backend is running on localhost:8080');
            } finally {
                setLoading(loginBtn, false);
            }
        });

        // SIGNUP
        document.getElementById('signup-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            if (!document.getElementById('agree-terms').checked) {
                alert('Please agree to the Terms of Service and Privacy Policy');
                return;
            }
            const signupBtn = document.getElementById('signup-btn');
            const fullName = document.getElementById('signup-name').value;
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;
            const confirmPassword = document.getElementById('signup-confirm').value;
            if (password !== confirmPassword) { alert('Passwords do not match'); return; }

            setLoading(signupBtn, true);

            try {
                const response = await fetch(`${API_BASE_URL}/signup`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fullName, email, password, confirmPassword })
                });
                const data = await response.json();
                if (data.success) {
                    localStorage.setItem('authToken', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    alert('Registration successful!');
                    window.location.href = 'home.html'; // local home
                } else {
                    alert('Registration failed: ' + data.message);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('An error occurred during registration. Make sure the backend is running on localhost:8080');
            } finally {
                setLoading(signupBtn, false);
            }
        });

        // Guest button
        document.querySelectorAll('.btn-guest').forEach(button => {
            button.addEventListener('click', () => { window.location.href = 'home.html'; });
        });

        // Backend health check
        async function checkBackendHealth() {
            try {
                const response = await fetch(`${API_BASE_URL}/health`);
                if (response.ok) console.log('Backend running');
            } catch { console.warn('Backend not running on localhost:8080'); }
        }
        checkBackendHealth();
    </script>
</body>
</html>
